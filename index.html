<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catch the Items - With Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>🎯 Catch the Falling Items!</h1>

    <!-- Login / Register Screen -->
    <div id="authScreen" class="screen active">
        <div class="auth-box">
            <h2 id="authTitle">Login</h2>
            
            <div id="loginForm">
                <input type="email" id="loginEmail" placeholder="Enter your email" required>
                <input type="password" id="loginPass" placeholder="Enter your password" required>
                <button onclick="loginUser()">Login</button>
                <p>Don't have an account? <a onclick="showRegister()">Register here</a></p>
            </div>

            <div id="registerForm" style="display: none;">
                <input type="email" id="regEmail" placeholder="Enter your email" required>
                <input type="password" id="regPass" placeholder="Create password (min 6 chars)" required>
                <button onclick="registerUser()">Register</button>
                <p>Already have an account? <a onclick="showLogin()">Login here</a></p>
            </div>

            <p id="authMsg" class="msg"></p>
        </div>
    </div>

    <!-- Game Screen -->
    <div id="gameScreen" class="screen">
        <div class="user-bar">
            <p>Welcome: <span id="userEmail"></span></p>
            <button id="logoutBtn" onclick="logoutUser()">Logout</button>
        </div>

        <div class="game-container">
            <canvas id="gameCanvas"></canvas>
            <div class="info">
                <p>Score: <span id="score">0</span></p>
                <p>Your High Score: <span id="highScore">0</span></p>
                <button id="startBtn">Start Game</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
